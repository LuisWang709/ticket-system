x-py-health: &py-health
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  catalog:
    build: ./services/catalog
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catalog
    ports: ["8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: *py-health

  gateway:
    image: nginx:1.27
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on:
      catalog: {condition: service_healthy}

  inventory:
    build: ./services/inventory
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      HOLD_SECONDS: "30"
      INVENTORY_MODE: "atomic"
    ports: [ "8002:8000" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *py-health

  order:
    build: ./services/order
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders
      INVENTORY_URL: http://inventory:8000
    ports: [ "8003:8000" ]
    depends_on:
      postgres: { condition: service_healthy }
      inventory: { condition: service_healthy }
    healthcheck: *py-health

  payment:
    build: ./services/payment
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payments
      DELAY_MS: "0"
      FAIL_RATE: "0"
    ports: [ "8004:8000" ]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: *py-health

  risk-stub:
    build: ./stubs/risk-stub
    profiles: ["stubs"]
    networks:
      default:
        aliases: [risk]

  inventory-stub:
    build: ./stubs/inventory-stub
    profiles: ["stubs"]
    networks:
      default:
        aliases: [inventory-stub]

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/member_b/Dockerfile
    environment:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      LIVE_ORDER_URL: http://order:8000
      LIVE_PAYMENT_URL: http://payment:8000
    depends_on:
      order: {condition: service_healthy}
      payment: {condition: service_healthy}

volumes:
  pgdata:
