x-py-health: &py-health
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  catalog:
    build: ./services/catalog
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/catalog
    ports: ["8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: *py-health

  gateway:
    image: nginx:1.27
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on:
      catalog: {condition: service_healthy}
  
  inventory:
    build: ./services/inventory
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      HOLD_SECONDS: "60"
      INVENTORY_MODE: "atomic"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports: [ "8002:8000" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *py-health

  risk-stub:
    build: ./stubs/risk-stub
    profiles: ["stubs"]
    networks:
      default:
        aliases: [risk]

volumes:
  pgdata: