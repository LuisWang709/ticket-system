worker_processes auto;
events { worker_connections 4096; }

http {
  log_format main '$remote_addr [$time_local] "$request" $status rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  # NEW: each client IP may do 10 requests/second (burst 20); the whole site 500/second.
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
  limit_req_zone $server_name        zone=global:1m  rate=500r/s;
  limit_req_status 429;

  server {
    listen 80;

    # NEW: friendly JSON body for 429
    error_page 429 = @too_many;
    location @too_many {
      default_type application/json;
      return 429 '{"error":"too_many_requests"}';
    }

    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }

    location /api/events {
      limit_req zone=per_ip burst=20 nodelay;   # NEW
      proxy_pass http://catalog:8000/events;
    }
  }
}