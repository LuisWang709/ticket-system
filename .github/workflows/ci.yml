name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile all python
        run: python -m compileall -q services
      - name: Compose file is valid
        run: docker compose config -q
  
  system-test:
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole system
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Contract smoke test
        run: ./scripts/contract_smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100